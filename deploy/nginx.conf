# nginx in front of the e-learning server: HTTPS on a subdomain, passed through to Node on port 3030.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/elearning-react
#   (change learn.tribeofabraham.com below to the address you're using)
#   sudo ln -s /etc/nginx/sites-available/elearning-react /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d learn.tribeofabraham.com     (adds the HTTPS certificate and redirect)
server {
    listen 80;
    listen [::]:80;
    server_name learn.tribeofabraham.com;

    # Statements are small; anything bigger isn't one
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
